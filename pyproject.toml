[project]
name = "arby"
version = "0.1.0"
description = "Cross-platform sports betting arbitrage detection and execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP and scraping
    "httpx>=0.27",
    "playwright>=1.45",
    # LLM
    "anthropic>=0.40",
    # Data layer
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Modeling
    "arch>=7.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    # Infrastructure
    "structlog>=24.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ASYNC", "SIM", "RET"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
markers = [
    "integration: tests that require running infrastructure (postgres, redis)",
    "slow: tests that take more than a few seconds",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
