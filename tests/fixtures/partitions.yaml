# Labeled partition validation test set.
#
# Each entry is a candidate pair of bets and a ground-truth label indicating
# whether the pair forms a valid partition (P(A ∪ B) = 1 and P(¬A ∧ ¬B) = 0)
# under the given match context.
#
# The partition validator's job is to label each pair correctly. False
# positives (predicting `valid` when the truth is `invalid`) are the dangerous
# error: they cause the system to place an unhedged bet. The cases below are
# weighted to expose the common trap shapes — win/loss without a draw, integer
# over/under push, asian handicap overlap, scope mismatch between halves and
# full match, double-chance overlap, goalscorer overlap, and knockout vs
# 90-minute scope confusion.
#
# Add new cases via the partition-test-case-generator skill.

